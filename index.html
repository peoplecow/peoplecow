<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>피플카우 약속잡기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#f7f4ee; --card:#ffffff; --ink:#1f2a24; --sub:#6b746e; --line:#e4e0d6;
    --brand:#1f5c46; --brand-2:#2f7a5e; --brand-soft:#e3efe8; --accent:#c8742c;
    --danger:#b3412f; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 48px}
  .proto{background:#fff6e5;border:1px dashed var(--accent);color:#7a4a1c;font-size:13px;
    padding:8px 12px;border-radius:10px;margin-bottom:14px}
  header.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}
  .logo{font-weight:800;font-size:20px;letter-spacing:-.3px;cursor:pointer}
  .logo span{color:var(--brand)}
  .tag{font-size:13px;color:var(--sub)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.4px}
  h2{font-size:18px;margin:0 0 12px;letter-spacing:-.3px}
  h3{font-size:15px;margin:18px 0 8px}
  p.muted,.muted{color:var(--sub);font-size:14px;margin:0}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 16px;font-size:16px;font-weight:700;
    cursor:pointer;margin-top:10px;font-family:inherit}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:active{background:var(--brand-2)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
  .btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin:0}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;
    border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px;cursor:pointer;font-family:inherit;color:inherit}
  .choice .ic{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center;font-size:22px;flex:none}
  .choice b{display:block;font-size:16px}
  .choice small{color:var(--sub);font-size:13px}
  label.f{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  input[type=text],input[type=email],select,textarea{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);
    border-radius:10px;background:#fff;font-family:inherit;color:inherit}
  textarea{min-height:70px;resize:vertical}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .err{color:var(--danger);font-size:14px;margin-top:8px;min-height:1px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:14px;cursor:pointer;font-family:inherit;color:inherit}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  /* calendar */
  .cal{margin-top:10px}
  .cal-title{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin:16px 0 8px}
  .cal-title small{font-weight:500;color:var(--sub)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dow{font-size:12px;text-align:center;color:var(--sub);padding:2px 0}
  .dow.sun{color:var(--danger)} .dow.sat{color:#2c5d9a}
  .day{aspect-ratio:1/1;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14px;cursor:pointer;
    display:grid;place-items:center;font-family:inherit;color:inherit;padding:0}
  .day.sun{color:var(--danger)} .day.sat{color:#2c5d9a}
  .day.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .day.off{visibility:hidden}
  .day.no{background:#fbe9e5;border-color:#e3a99c;color:var(--danger);text-decoration:line-through}
  .seg{display:flex;background:#eeebe3;border-radius:12px;padding:4px;margin:12px 0 4px}
  .seg button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .day.past{opacity:.3;cursor:not-allowed}
  /* code box */
  .codebox{text-align:center;background:var(--brand-soft);border-radius:var(--radius);padding:18px;margin:12px 0}
  .codebox .lbl{font-size:13px;color:var(--brand);font-weight:700}
  .codebox .code{font-size:30px;font-weight:800;letter-spacing:2px;font-family:ui-monospace,Menlo,Consolas,monospace;margin:6px 0}
  .codebox.warn{background:#fff3e6}
  .codebox.warn .lbl{color:var(--accent)}
  #qr{display:flex;justify-content:center;margin:12px 0}
  #qr img,#qr canvas{background:#fff;padding:8px;border-radius:8px}
  /* stats */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:12px;color:var(--sub)}
  .bar{display:grid;grid-template-columns:92px 1fr 34px;align-items:center;gap:8px;margin:6px 0;font-size:14px}
  .bar .t{height:22px;background:#eeebe3;border-radius:6px;overflow:hidden}
  .bar .t i{display:block;height:100%;background:var(--brand-2);border-radius:6px}
  .bar.top .t i{background:var(--accent)}
  .bar .n{text-align:right;color:var(--sub)}
  .pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--brand-soft);color:var(--brand)}
  .pill.done{background:#efe6da;color:#7a4a1c}
  .list-item{border-top:1px solid var(--line);padding:12px 0}
  .list-item:first-child{border-top:0}
  .confirmed{background:#fff3e6;border:1px solid #f0cfa8;border-radius:12px;padding:12px;margin-bottom:12px;font-weight:700}
  footer{font-size:12px;color:var(--sub);margin-top:22px;line-height:1.6}
  .linkish{background:none;border:0;color:var(--brand);font-weight:700;cursor:pointer;padding:0;font-family:inherit;font-size:14px}
  .hidden{display:none}
  .notice{background:#fff8ec;border:1px solid #f0d9b5;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:13px;color:#5c4a33}
  .notice ul{margin:6px 0 0;padding-left:18px}
  .notice li{margin:3px 0}
  label.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px;cursor:pointer}
  label.check input{width:18px;height:18px}
  .names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--brand);font-weight:700;font-size:15px;padding:4px 2px 12px;cursor:pointer;font-family:inherit}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a24;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo" onclick="go('home')">🐄 피플<span>카우</span></div>
    <div class="tag">좋은 만남이 기회가 됩니다.</div>
  </header>
  <main id="app"></main>
  <footer id="foot">
    <b>개인정보 안내</b> · 이메일·전화번호는 받지 않습니다. 저장 항목: 닉네임, 가능 날짜, 선호 지역·장소, 못 먹는 음식, 꺼리는 장소, 기타 요청. 이용 목적: 모임 날짜 조율.
    닉네임은 실명 대신 별명을 권장합니다. 보관 기간: 모임이 끝나고 3개월이 지나면 개별 응답을 지우고 날짜별 인원 통계만 남깁니다. 문의: peoplecow.help@gmail.com
    <div style="margin-top:10px">© 2026 peoplecow · 나는 총무다</div>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 설정 ===================== */
// 공개용(publishable) 키입니다. 브라우저에 넣어도 되는 키이며, 표는 직접 읽을 수 없고 정해진 함수만 부를 수 있습니다.
const SB_URL = "https://tboodhrfzmldyuvrgfyd.supabase.co";
const SB_KEY = "sb_publishable_XUxlTZ7zF6NLkNYaTVGnCg_cPKIuoB3";
const SITE_URL = "https://peoplecow.com/";   // QR에 넣을 주소 (배포 전에는 현재 페이지 주소를 씀)

const REGIONS = ["강남","서초","잠실·송파","종로·광화문","을지로·시청","여의도","마포·홍대","성수","판교·분당","기타"];
const FOODS = ["없음","해산물","돼지고기","소고기","매운 음식","날음식(회 등)","유제품","견과류","채식만 가능"];
const AVOID = ["없음","시끄러운 곳","좌식","룸 없음","주차 어려움","계단 많은 곳"];
const ERR = {
  INVALID_EMAIL:"이메일 형식을 확인해 주세요.",
  NEED_PID:"이미 등록된 이메일입니다. 처음 받은 고유코드를 함께 입력해 주세요.",
  PID_MISMATCH:"이메일과 고유코드가 맞지 않습니다.",
  NO_MEETING:"없는 모임코드입니다. 글자를 다시 확인해 주세요.",
  ENDED:"이미 끝난 모임입니다.",
  NO_DATES:"가능한 날짜를 하루 이상 골라 주세요.",
  BAD_DATES:"고를 수 없는 날짜가 들어 있습니다.",
  TOO_LONG:"입력한 내용이 너무 깁니다.",
  BAD_TITLE:"모임 이름은 1~30자로 적어 주세요.",
  BAD_MONTH:"연도와 월을 확인해 주세요.",
  PAST_MONTH:"이미 지난 달입니다. 다른 달을 골라 주세요.",
  NOT_CREATOR:"모임을 만든 사람의 고유코드가 아닙니다.",
  NOT_MEMBER:"이 모임에 응답한 사람의 고유코드가 아닙니다. 먼저 응답한 뒤 결과를 볼 수 있어요.",
  PID_NOT_FOUND:"없는 고유코드입니다. 글자를 다시 확인하거나, 처음이면 비워 두세요.",
  BAD_NICK:"닉네임은 1~12자로 적어 주세요.",
  NICK_TAKEN:"이 모임에 같은 닉네임이 이미 있습니다. 다른 닉네임을 써 주세요."
};

/* ===================== 서버 호출 ===================== */
async function rpc(fn,args={}){
  let res;
  try{
    res=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",
      headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
  }catch(e){throw new Error("인터넷 연결을 확인해 주세요.")}
  const body=await res.json().catch(()=>null);
  if(!res.ok){const k=(body&&body.message)||"";throw new Error(ERR[k]||"잠시 후 다시 시도해 주세요. ("+(k||res.status)+")")}
  return body;
}

/* ===================== 도우미 ===================== */
const DOW=["일","월","화","수","목","금","토"];
const NOW=new Date(); const TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
function cleanMeetingCode(s){s=(s||"").toUpperCase().replace(/\s/g,"");if(/^\d{2}[A-Z0-9]{6}$/.test(s))s=s.slice(0,2)+"-"+s.slice(2);return s}
function cleanPid(s){s=(s||"").toUpperCase().replace(/\s/g,"");if(/^P?-?[A-Z0-9]{8}$/.test(s)){s=s.replace(/^P?-?/,"");s="P-"+s.slice(0,4)+"-"+s.slice(4)}return s}
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e||"")}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseYmd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function label(s){const d=parseYmd(s);return (d.getMonth()+1)+"/"+d.getDate()+"("+DOW[d.getDay()]+")"}
function monthPair(y,m){const a={y,m};const b=m===12?{y:y+1,m:1}:{y,m:m+1};return [a,b]}
function lastDayOfPair(y,m){const [,b]=monthPair(y,m);return new Date(b.y,b.m,0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("복사했어요"),()=>toast(t))}
function joinLink(code){const here=location.href.split("?")[0].split("#")[0];return (here.startsWith("http")?here:SITE_URL)+"?code="+code}
async function busy(btn,errEl,fn){
  if(errEl)errEl.textContent="";
  const t=btn.textContent;btn.disabled=true;btn.textContent="잠시만요…";
  try{await fn()}catch(e){if(errEl)errEl.textContent=e.message;else toast(e.message)}
  finally{if(document.body.contains(btn)){btn.disabled=false;btn.textContent=t}}
}
const LS_KEY="peoplecow.pid";
let CUR_PID="";  // 이번 방문에서 쓴 고유코드 (기기에 기억하지 않아도 결과 보기에 씀)
function savedPid(){try{return localStorage.getItem(LS_KEY)||""}catch(e){return ""}}
function rememberPid(p){try{localStorage.setItem(LS_KEY,p)}catch(e){}}
function forgetPid(){try{localStorage.removeItem(LS_KEY)}catch(e){};toast("이 기기에서 고유코드를 지웠어요");render()}
const lostNotice=()=>`<div class="notice"><b>⚠️ 고유코드 분실 유의사항</b>
  <ul><li>고유코드는 <b>다시 찾아드릴 수 없습니다.</b> 캡처하거나 메모해 두세요.</li>
  <li>"이 기기에 기억하기"를 켜면 같은 기기·브라우저에서 자동으로 채워집니다. 방문 기록을 지우거나 시크릿 모드·다른 기기에서는 기억되지 않습니다.</li>
  <li>잃어버리면 다른 닉네임으로 새로 참여하면 됩니다. 이전 응답은 고칠 수 없습니다.</li>
  <li>모임을 만든 사람이 잃어버리면 날짜 확정을 할 수 없으니, 모임을 새로 만들어 주세요.</li></ul><p style="margin:6px 0 0"><a href="guide" style="font-weight:600">📖 사용 방법</a> 페이지에서 자세히 볼 수 있어요.</p></div>`;
const pidField=(id,remId)=>{const sp=savedPid();return `
    <label class="f">내 고유코드 <span class="muted">(전에 받은 적이 있으면 입력, 처음이면 비워두기)</span></label>
    <input type="text" id="${id}" placeholder="P-XXXX-XXXX" autocapitalize="characters" value="${esc(S.pidIn??sp)}">
    ${sp?`<p class="muted" style="margin-top:4px">이 기기에 기억된 코드가 채워졌어요.</p>`:""}
    <label class="check"><input type="checkbox" id="${remId}" ${S.remember===false?"":"checked"}> 이 기기에 고유코드 기억하기</label>`};

/* ===================== 라우팅 ===================== */
let S={};
const PAGES={},AFTER={};
// 뒤로가기: 첫 화면 → 다른 화면은 기록 1칸만 쌓고, 휴대폰·브라우저 뒤로가기를 누르면 첫 화면으로 돌아옵니다.
function go(page,params={}){
  const onSub=history.state&&history.state.pc==="sub";
  if(page==="home"&&onSub){history.back();return}
  S={page,...params};
  if(page!=="home"&&!onSub) history.pushState({pc:"sub"},"");
  render();window.scrollTo(0,0);
}
window.addEventListener("popstate",()=>{S={page:"home"};render();window.scrollTo(0,0)});
function render(){
  const back=S.page!=="home"?`<button class="back" onclick="go('home')">← 처음으로</button>`:"";
  document.getElementById("app").innerHTML=back+(PAGES[S.page]||PAGES.home)();(AFTER[S.page]||(()=>{}))()}
async function load(page,params,loader){
  document.getElementById("app").innerHTML='<div class="card"><p class="muted">불러오는 중…</p></div>';
  try{const data=await loader();go(page,{...params,...data})}
  catch(e){if(!e)return;document.getElementById("app").innerHTML=`<div class="card"><p class="err">${esc(e.message)}</p><button class="btn ghost" onclick="go('home')">처음으로</button></div>`}
}

/* ===================== 첫 화면 ===================== */
PAGES.home=()=>{
  const st=S.stats||{active:"-",total:"-",month_responses:"-"};
  return `
  <div class="card">
    <h1>모임 날짜, 한 번에 정해요</h1>
    <p class="muted">참석 가능한 날짜를 모으면 가능 인원이 가장 많은 날이 보입니다. 가입은 필요 없습니다. <a href="guide" style="font-weight:600">📖 사용 방법</a></p>
  </div>
  <button class="choice" onclick="go('create1')"><div class="ic">✍️</div><div><b>약속을 처음 만들어요</b><small>모임코드와 QR을 받아 멤버에게 나눠줍니다</small></div></button>
  <button class="choice" onclick="go('join1')"><div class="ic">🙋</div><div><b>만들어진 약속에 참여해요</b><small>받은 모임코드를 넣고 가능한 날짜를 고릅니다</small></div></button>
  <button class="choice" onclick="go('view')"><div class="ic">📊</div><div><b>모임 결과 보기</b><small>모임코드와 내 고유코드를 넣으면 날짜별 참석 가능 인원이 보입니다</small></div></button>
  <div class="card">
    <h2>피플카우 전체 현황</h2>
    <div class="stats">
      <div class="stat"><b>${st.active}</b><span>진행 중 모임</span></div>
      <div class="stat"><b>${st.total}</b><span>누적 모임</span></div>
      <div class="stat"><b>${st.month_responses}</b><span>이번 달 응답</span></div>
    </div>
    <p class="muted" style="margin-top:10px">모임별 결과는 모임코드를 입력한 사람만 볼 수 있습니다.</p>
  </div>
  <div class="card">
    <h2>내 참여 기록</h2>
    <p class="muted">고유코드를 넣으면 내가 참여한 모임만 보입니다.</p>
    <label class="f">고유코드</label><input type="text" id="mPid" placeholder="P-XXXX-XXXX" autocapitalize="characters" value="${esc(savedPid())}">
    <div class="err" id="mErr"></div>
    <button class="btn ghost" id="mBtn" onclick="lookupMine(this)">내 기록 보기</button>
    ${savedPid()?`<p style="margin-top:10px;text-align:right"><button class="linkish" onclick="forgetPid()">이 기기에서 코드 지우기</button></p>`:""}
    ${lostNotice()}
  </div>
  <div style="text-align:center"><button class="linkish" onclick="load('archive',{},async()=>({rows:await rpc('pc_archive')}))">지난 모임 통계 (연도·월별) →</button></div>`;
};
AFTER.home=()=>{ if(!S.stats) rpc("pc_stats").then(st=>{if(S.page==="home"){S.stats=st;render()}}).catch(()=>{}); };

/* ===================== 만들기 1 ===================== */
PAGES.create1=()=>{
  const y=S.y||TODAY.getFullYear(), m=S.m||TODAY.getMonth()+1;
  const years=[TODAY.getFullYear(),TODAY.getFullYear()+1];
  const [a,b]=monthPair(y,m);
  return `
  <div class="card">
    <h2>1. 언제쯤 모일까요?</h2>
    <p class="muted">연도와 월을 고르면 그 달과 다음 달, 두 달이 후보가 됩니다.</p>
    <div class="row">
      <div><label class="f">연도</label><select id="cy">${years.map(v=>`<option ${v===y?"selected":""}>${v}</option>`).join("")}</select></div>
      <div><label class="f">시작 월</label><select id="cm">${Array.from({length:12},(_,i)=>i+1).map(v=>`<option value="${v}" ${v===m?"selected":""}>${v}월</option>`).join("")}</select></div>
    </div>
    <p style="margin:12px 0 0"><span class="pill">후보: ${a.y}년 ${a.m}월 · ${b.y}년 ${b.m}월</span></p>
    <label class="f">모임 이름 <span class="muted">(코드를 가진 사람에게만 보임)</span></label>
    <input type="text" id="ct" placeholder="예: 11월 동기 모임" maxlength="30" value="${esc(S.title||"")}">
    <label class="f">내 닉네임 <span class="muted">(멤버에게 보임, 실명 대신 별명 권장)</span></label>
    <input type="text" id="cn" placeholder="예: 총무" maxlength="12" value="${esc(S.nick||"")}">
    ${pidField("cp","cRem")}
    <div class="err" id="cErr"></div>
    <button class="btn primary" onclick="create1Next(this)">다음: 내 가능 날짜 고르기</button>
  </div>`;
};
AFTER.create1=()=>{
  const upd=()=>{S.y=+cy.value;S.m=+cm.value;S.title=ct.value;S.nick=cn.value;S.pidIn=cp.value;S.remember=cRem.checked;render()};
  cy.onchange=upd;cm.onchange=upd;
};
function create1Next(btn){
  const title=ct.value.trim(),nick=cn.value.trim(),pidIn=cleanPid(cp.value.trim()),remember=cRem.checked;
  const y=+cy.value,m=+cm.value;
  if(!title) return cErr.textContent="모임 이름을 적어 주세요.";
  if(!nick||nick.length>12) return cErr.textContent=ERR.BAD_NICK;
  if(lastDayOfPair(y,m)<TODAY) return cErr.textContent=ERR.PAST_MONTH;
  busy(btn,cErr,async()=>{
    const r=await rpc("pc_check_identity",{p_pid:pidIn});
    go("answer",{mode:"create",mt:{title,y,m},nick,pidIn,remember,isNew:r.is_new,sel:new Set(),regions:new Set(),foods:new Set(),avoid:new Set()});
  });
}

/* ===================== 참여 1 ===================== */
PAGES.join1=()=>`
  <div class="card">
    <h2>모임코드를 넣어 주세요</h2>
    <p class="muted">모임을 만든 사람에게 받은 코드나 QR로 들어옵니다.</p>
    <label class="f">모임코드</label><input type="text" id="jc" placeholder="26-XXXXXX" autocapitalize="characters" value="${esc(S.code||"")}">
    <label class="f">내 닉네임 <span class="muted">(멤버에게 보임, 실명 대신 별명 권장)</span></label>
    <input type="text" id="jn" placeholder="예: 철수 · 응답을 고칠 때는 비워도 됨" maxlength="12">
    ${pidField("jp","jRem")}
    <div class="err" id="jErr"></div>
    <button class="btn primary" onclick="join1Next(this)">다음: 가능한 날짜 고르기</button>
    ${lostNotice()}
  </div>`;
function join1Next(btn){
  const code=cleanMeetingCode(jc.value),pidIn=cleanPid(jp.value.trim()),remember=jRem.checked;
  let nick=jn.value.trim();
  if(!code) return jErr.textContent="모임코드를 넣어 주세요.";
  if(nick.length>12) return jErr.textContent=ERR.BAD_NICK;
  busy(btn,jErr,async()=>{
    const r=await rpc("pc_check_join",{p_code:code,p_pid:pidIn});
    const p=r.prev;
    if(!nick&&p) nick=p.nickname;
    if(!nick) throw new Error("닉네임을 적어 주세요.");
    go("answer",{mode:"join",code:r.code,mt:{title:r.title,y:r.y,m:r.m},nick,pidIn,remember,isNew:r.is_new,edit:!!p,
      sel:new Set(p?p.dates:[]),regions:new Set(p?p.regions:[]),foods:new Set(p?p.foods:[]),avoid:new Set(p?p.avoid:[]),
      place:p?p.place:"",memo:p?p.memo:""});
  });
}

/* ===================== 응답 화면 ===================== */
function calHTML(y,m){
  const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate();
  const pre=y+"-"+String(m).padStart(2,"0");
  let h=`<div class="cal-title">${y}년 ${m}월 <small>${[...S.sel].filter(s=>s.startsWith(pre)).length}일 선택</small></div><div class="grid">`;
  DOW.forEach((d,i)=>h+=`<div class="dow ${i===0?"sun":i===6?"sat":""}">${d}</div>`);
  for(let i=0;i<first.getDay();i++)h+=`<div class="day off"></div>`;
  for(let d=1;d<=days;d++){
    const dt=new Date(y,m-1,d),k=ymd(dt),w=dt.getDay(),past=dt<TODAY;
    h+=`<button class="day ${w===0?"sun":w===6?"sat":""} ${S.sel.has(k)?(S.pick==="no"?"no":"on"):""} ${past?"past":""}" ${past?"disabled":""} data-d="${k}">${d}</button>`;
  }
  return h+"</div>";
}
function eligibleDays(){const out=[];monthPair(S.mt.y,S.mt.m).forEach(({y,m})=>{const n=new Date(y,m,0).getDate();for(let d=1;d<=n;d++){const dt=new Date(y,m-1,d);if(dt>=TODAY)out.push(ymd(dt))}});return out}
function finalDates(){return S.pick==="no"?eligibleDays().filter(k=>!S.sel.has(k)):[...S.sel].sort()}
function chipsHTML(id,list,set){return `<div class="chips" id="${id}">${list.map(v=>`<button class="chip ${set.has(v)?"on":""}" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>`}
PAGES.answer=()=>{
  const mt=S.mt;const [a,b]=monthPair(mt.y,mt.m);
  return `
  <div class="card">
    <h2>${S.mode==="create"?"2. 참석이 가능한 날":"가능한 날짜를 골라 주세요"}</h2>
    <p class="muted">${esc(mt.title)} · 닉네임 <b>${esc(S.nick)}</b> · 두 달 중 한 달만 골라도 됩니다. ${S.edit?"<b>전에 낸 응답을 고칩니다.</b>":""}</p>
    <div class="seg"><button class="${S.pick!=="no"?"on":""}" onclick="setPick('yes')">✅ 가능</button><button class="${S.pick==="no"?"on":""}" onclick="setPick('no')">❌ 불가</button></div>
    <p class="muted">${S.pick==="no"?"참석이 어려운 날만 누르세요. <b>누르지 않은 날은 모두 가능</b>으로 저장됩니다.":"참석 가능한 날을 누르세요. 거의 다 가능하면 '불가'로 고르는 편이 빠릅니다."} (가능 ${finalDates().length}일)</p>
    <div class="cal">${calHTML(a.y,a.m)}${calHTML(b.y,b.m)}</div>
    <h3>선호 지역 <span class="muted">(여러 개)</span></h3>${chipsHTML("cR",REGIONS,S.regions)}
    <label class="f">선호 장소 직접 입력 <span class="muted">(선택)</span></label><input type="text" id="aPlace" maxlength="40" value="${esc(S.place||"")}" placeholder="예: 강남역 근처 한식">
    <h3>못 먹는 음식</h3>${chipsHTML("cF",FOODS,S.foods)}
    <h3>꺼리는 장소</h3>${chipsHTML("cA",AVOID,S.avoid)}
    <label class="f">기타 요청 <span class="muted">(선택)</span></label><textarea id="aMemo" maxlength="200">${esc(S.memo||"")}</textarea>
    <div class="err" id="aErr"></div>
    <button class="btn primary" id="aBtn" onclick="submitAnswer(this)">${S.mode==="create"?"모임 만들고 코드 받기":(S.edit?"응답 고치기":"제출하기")}</button>
    <button class="btn ghost" onclick="go('${S.mode==="create"?"create1":"join1"}',{code:'${S.code||""}'})">이전</button>
  </div>`;
};
AFTER.answer=()=>{
  document.querySelectorAll(".day[data-d]").forEach(el=>el.onclick=()=>{const k=el.dataset.d;S.sel.has(k)?S.sel.delete(k):S.sel.add(k);keepAndRender()});
  const bind=(id,set,exclusive)=>document.querySelectorAll("#"+id+" .chip").forEach(el=>el.onclick=()=>{
    const v=el.dataset.v;
    if(set.has(v))set.delete(v);else{ if(exclusive){ if(v===exclusive)set.clear();else set.delete(exclusive)} set.add(v)}
    keepAndRender()});
  bind("cR",S.regions);bind("cF",S.foods,"없음");bind("cA",S.avoid,"없음");
};
function setPick(v){if((S.pick||"yes")===v)return;if(S.sel.size&&!confirm("방식을 바꾸면 지금 고른 날짜가 지워집니다. 바꿀까요?"))return;S.sel=new Set();S.pick=v;keepAndRender()}
function keepAndRender(){S.place=aPlace.value;S.memo=aMemo.value;const y=window.scrollY;render();window.scrollTo(0,y)}
function submitAnswer(btn){
  S.place=aPlace.value.trim();S.memo=aMemo.value.trim();
  const fd=finalDates();if(fd.length===0) return aErr.textContent=S.pick==="no"?"모든 날을 불가로 고르셨어요. 가능한 날이 하루는 있어야 합니다.":ERR.NO_DATES;
  const common={p_nickname:S.nick,p_pid:S.pidIn||"",p_dates:fd,p_regions:[...S.regions],p_place:S.place,p_foods:[...S.foods],p_avoid:[...S.avoid],p_memo:S.memo};
  busy(btn,aErr,async()=>{
    let r;
    if(S.mode==="create") r=await rpc("pc_create_meeting",{p_title:S.mt.title,p_y:S.mt.y,p_m:S.mt.m,...common});
    else r=await rpc("pc_submit",{p_code:S.code,...common});
    CUR_PID=r.pid; if(S.remember) rememberPid(r.pid);
    go("done",{mode:S.mode,code:r.code,issued:r.issued?r.pid:null,remembered:!!S.remember,mt:S.mt});
  });
}

/* ===================== 완료 ===================== */
PAGES.done=()=>`
  <div class="card">
    <h2>${S.mode==="create"?"모임이 만들어졌어요":"응답을 받았어요"}</h2>
    ${S.issued?`<div class="codebox warn"><div class="lbl">내 고유코드 · 이 화면에서만 한 번 보여드립니다</div><div class="code">${S.issued}</div>
      <p class="muted">응답을 고치거나 다른 모임에 참여할 때, 모임을 확정할 때 필요합니다. ${S.remembered?"<b>이 기기에 기억해 두었어요.</b>":""}</p>
      <button class="btn small ghost" style="margin-top:8px" onclick="copy('${S.issued}')">고유코드 복사</button></div>${lostNotice()}`:""}
    ${S.mode==="create"?`
      <div class="codebox"><div class="lbl">모임코드 · 멤버에게 나눠주세요</div><div class="code">${S.code}</div>
        <div id="qr"></div>
        <div class="row" style="margin-top:6px"><button class="btn small ghost" onclick="copy('${S.code}')">코드 복사</button><button class="btn small ghost" onclick="copy(joinLink('${S.code}'))">참여 링크 복사</button></div>
      </div>
      <p class="muted">${esc(S.mt.title)} · 확정하지 않으면 ${ymd(lastDayOfPair(S.mt.y,S.mt.m))} 다음날 자동으로 끝납니다.</p>`:""}
    <button class="btn primary" onclick="openResult('${S.code}')">모임 결과 보기</button>
    <button class="btn ghost" onclick="go('home')">처음으로</button>
  </div>`;
AFTER.done=()=>{
  if(S.mode!=="create")return;
  const el=document.getElementById("qr");
  if(window.QRCode) new QRCode(el,{text:joinLink(S.code),width:160,height:160,correctLevel:QRCode.CorrectLevel.M});
  else el.innerHTML='<p class="muted">QR은 인터넷 연결 시 표시됩니다.</p>';
};

/* ===================== 결과 ===================== */
function openResult(code,pid){
  pid=cleanPid(pid||CUR_PID||savedPid());
  if(!pid) return go("view",{code});
  load("result",{code,vpid:pid},async()=>{
    try{return {r:await rpc("pc_result",{p_code:code,p_pid:pid})}}
    catch(e){go("view",{code,err:e.message});throw null}
  });
}
function viewSubmit(btn){
  const c=cleanMeetingCode(vc.value),p=cleanPid(vp.value);
  if(!c) return vErr.textContent="모임코드를 넣어 주세요.";
  if(!p) return vErr.textContent="내 고유코드를 넣어 주세요.";
  CUR_PID=p; openResult(c,p);
}
PAGES.view=()=>`
  <div class="card">
    <h2>모임 결과 보기</h2>
    <p class="muted">이 모임에 응답한 사람만 볼 수 있습니다. 아직 응답하지 않았다면 먼저 응답해 주세요. <a href="guide" style="font-weight:600">📖 사용 방법</a></p>
    <label class="f">모임코드</label><input type="text" id="vc" placeholder="26-XXXXXX" autocapitalize="characters" value="${esc(S.code||"")}">
    <label class="f">내 고유코드</label><input type="text" id="vp" placeholder="P-XXXX-XXXX" autocapitalize="characters" value="${esc(CUR_PID||savedPid())}">
    <div class="err" id="vErr">${esc(S.err||"")}</div>
    <button class="btn primary" onclick="viewSubmit(this)">보기</button>
    <button class="btn ghost" onclick="go('join1',{code:cleanMeetingCode(vc.value)})">아직 응답 전이에요 → 응답하기</button>
  </div>`;
PAGES.result=()=>{
  const r=S.r,n=r.n,max=r.dates.length?r.dates[0][1]:0;
  const bars=(arr,isDate)=>arr.map(([k,v])=>`<div class="bar ${isDate&&v===max?"top":""}"><span>${esc(isDate?label(k):k)}</span><div class="t"><i style="width:${n?Math.round(v/n*100):0}%"></i></div><span class="n">${v}명</span></div>`).join("")||'<p class="muted">아직 없음</p>';
  const chips=arr=>arr.length?`<div class="chips">${arr.map(([k,v])=>`<span class="chip">${esc(k)} ${v}</span>`).join("")}</div>`:'<p class="muted">없음</p>';
  const [a,b]=monthPair(r.y,r.m);
  return `
  <div class="card">
    <p style="margin:0 0 6px"><span class="pill ${r.ended?"done":""}">${r.ended?"끝난 모임":"진행 중"}</span> <span class="muted">${r.code}</span></p>
    <h2 style="margin-bottom:4px">${esc(r.title)}</h2>
    <p class="muted">응답 ${n}명 · 후보 ${a.m}월·${b.m}월</p>
    ${r.names&&r.names.length?`<div class="names">${r.names.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`:""}
  </div>
  ${r.confirmed?`<div class="confirmed">📌 확정된 날짜: ${label(r.confirmed)}</div>`:""}
  <div class="card">
    <h2>날짜별 가능 인원</h2>
    <p class="muted" style="margin-bottom:8px">주황색이 가능 인원이 가장 많은 날입니다. 상위 10일만 표시합니다.</p>
    ${bars(r.dates.slice(0,10),true)}
  </div>
  <div class="card">
    <h2>장소 참고</h2>
    <h3 style="margin-top:0">선호 지역</h3>${bars(r.regions)}
    ${r.places.length?`<h3>직접 적은 장소</h3><p class="muted">${r.places.map(esc).join(" · ")}</p>`:""}
    <h3>못 먹는 음식</h3>${chips(r.foods)}
    <h3>꺼리는 장소</h3>${chips(r.avoid)}
    ${r.memos.length?`<h3>기타 요청</h3><p class="muted">${r.memos.map(esc).join("<br>")}</p>`:""}
    <p class="muted" style="margin-top:12px">맛집은 이 집계를 바탕으로 모임을 만든 사람이 따로 정합니다.</p>
  </div>
  ${!r.ended&&r.dates.length&&r.is_creator?`<div class="card">
    <h2>날짜 확정 <span class="muted" style="font-size:13px;font-weight:500">(모임 만든 사람에게만 보임)</span></h2>
    <label class="f">확정할 날짜</label>
    <select id="rD">${r.dates.filter(([k])=>parseYmd(k)>=TODAY).map(([k,v])=>`<option value="${k}" ${r.confirmed===k?"selected":""}>${label(k)} · ${v}명</option>`).join("")}</select>
    <div class="err" id="rErr"></div>
    <button class="btn primary" onclick="confirmDate(this)">이 날짜로 확정</button>
    <p class="muted" style="margin-top:8px">확정하면 그 다음날 모임이 끝나고 지난 모임 통계로 옮겨집니다.</p>
  </div>`:""}
  ${!r.ended?`<button class="btn ghost" onclick="go('join1',{code:'${r.code}'})">이 모임에 응답하기 / 고치기</button>`:""}
  <button class="btn ghost" onclick="go('home')">처음으로</button>`;
};
function confirmDate(btn){
  busy(btn,rErr,async()=>{
    await rpc("pc_confirm",{p_code:S.code,p_pid:S.vpid,p_date:rD.value});
    toast("확정했어요");openResult(S.code,S.vpid);
  });
}

/* ===================== 내 기록 ===================== */
function lookupMine(btn){
  const pid=cleanPid(mPid.value);
  if(!pid) return mErr.textContent="고유코드를 넣어 주세요.";
  busy(btn,mErr,async()=>{const rows=await rpc("pc_mine",{p_pid:pid});CUR_PID=pid;go("mine",{rows,pid})});
}
PAGES.mine=()=>`<div class="card">
    <h2>내 참여 기록</h2>
    <p class="muted">${S.pid}</p>
    ${S.rows.map(r=>`<div class="list-item">
      <b>${esc(r.title)}</b> <span class="pill ${r.ended?"done":""}">${r.ended?"끝남":"진행 중"}</span>${r.is_creator?' <span class="pill">내가 만든 모임</span>':""}<br>
      <span class="muted">${r.code} · 닉네임 ${esc(r.nickname)} · 내가 고른 날짜: ${r.dates.map(label).join(", ")}</span>
      ${r.confirmed?`<br><span class="muted">확정: ${label(r.confirmed)}</span>`:""}
      <div style="margin-top:8px"><button class="btn small ghost" onclick="openResult('${r.code}','${S.pid}')">결과 보기</button></div></div>`).join("")||'<p class="muted">참여한 모임이 없습니다.</p>'}
  </div><button class="btn ghost" onclick="go('home')">처음으로</button>`;

/* ===================== 지난 모임 통계 ===================== */
PAGES.archive=()=>`<div class="card">
    <h2>지난 모임 통계</h2>
    <p class="muted" style="margin-bottom:8px">모임 이름과 코드 없이 연도·월별 숫자만 남깁니다.</p>
    ${S.rows.map(x=>`<div class="list-item"><b>${x.ym.slice(0,4)}년 ${+x.ym.slice(5)}월</b><br><span class="muted">모임 ${x.meetings}개 · 응답 ${x.responses}명 · 날짜 확정 ${x.confirmed}개</span></div>`).join("")||'<p class="muted">아직 끝난 모임이 없습니다.</p>'}
  </div><button class="btn ghost" onclick="go('home')">처음으로</button>`;

/* 시작: ?code= 로 들어오면 참여 화면 */
(function start(){
  history.replaceState({pc:"home"},"");
  const q=new URLSearchParams(location.search).get("code");
  if(q) go("join1",{code:cleanMeetingCode(q)}); else go("home");
})();
</script>
</body>
